
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" fill="none">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171329"/>
      <stop offset="0.55" stop-color="#30245C"/>
      <stop offset="1" stop-color="#172B55"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C4B5FD"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="240" rx="20" fill="url(#background)"/>

  <ellipse cx="250" cy="130" rx="160" ry="70"
           fill="#8B5CF6" opacity=".32" filter="url(#blur)">
    <animate attributeName="cx" values="250;340;250" dur="12s" repeatCount="indefinite"/>
  </ellipse>

  <path d="M-40 160 C130 30 240 250 420 130 S700 40 850 150 S1080 230 1240 80"
        stroke="url(#flow)" stroke-width="3" stroke-linecap="round" opacity=".8">
    <animate attributeName="d"
      values="M-40 160 C130 30 240 250 420 130 S700 40 850 150 S1080 230 1240 80;
              M-40 120 C130 230 240 20 420 150 S700 220 850 90 S1080 40 1240 150;
              M-40 160 C130 30 240 250 420 130 S700 40 850 150 S1080 230 1240 80"
      dur="14s" repeatCount="indefinite"/>
  </path>

  <path d="M-30 195 C150 90 300 230 480 165 S770 70 930 175 S1110 130 1230 120"
        stroke="#A5B4FC" stroke-width="1.5" opacity=".5">
    <animate attributeName="d"
      values="M-30 195 C150 90 300 230 480 165 S770 70 930 175 S1110 130 1230 120;
              M-30 150 C150 210 300 90 480 190 S770 200 930 120 S1110 200 1230 90;
              M-30 195 C150 90 300 230 480 165 S770 70 930 175 S1110 130 1230 120"
      dur="18s" repeatCount="indefinite"/>
  </path>

  <circle cx="960" cy="65" r="28" stroke="#C4B5FD" stroke-width="1.5" opacity=".65">
    <animate attributeName="r" values="24;34;24" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="960" cy="65" r="7" fill="#A5B4FC" opacity=".8"/>

  <circle cx="1030" cy="180" r="4" fill="#93C5FD">
    <animate attributeName="cy" values="180;165;180" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
